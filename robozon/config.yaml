# ============================================================
# Робозон, Задача 1: Имитационная модель сортировочного центра
# Команда: Ящик Шрёдингера (yashchik_shryodingera_517)
#
# Все значения с пометкой [ТЗ] взяты из официальной постановки.
# Значения с пометкой [ОЦЕНКА] — наши инженерные допущения,
# подлежат калибровке (см. docs/assumptions.md).
# ============================================================

simulation:
  hours: 24            # горизонт прогона (критерий: метрики за 1 мин/1 ч/12 ч/24 ч)
  seed: 42             # зерно случайности (воспроизводимость)
  chute_sweep_sec: 60  # период проверки таймаутов закрытия коробов

flow:
  items_per_hour: 100000      # [ТЗ] входящий поток товаров
  items_per_box: 27           # [ТЗ] в среднем товаров в одном КТЯ
  boxes_per_pallet: 20        # [ТЗ] КТЯ на палете
  pallets_per_hour: 185       # [ТЗ] палет в час в буфер приёмки
  directions: 400             # [ТЗ] направлений сортировки
  pareto_top_frac: 0.20       # [ТЗ] «на 20% направлений...
  pareto_top_share: 0.80      #  ...может приходиться до 80% объёма»
  p_nonsort: 0.05             # [ОЦЕНКА] доля nonsort-товаров: В ТЗ НЕ ЗАДАНА,
                              # является изменяемым параметром модели (критерий 5.2)

receiving:
  buffer_pallets: 80          # [ОЦЕНКА] ёмкость буфера приёмки, палет
  arrival_pattern: uniform    # uniform | exponential (волны — сценарий)

depalletizing:                # вскрытие палет: стрейч-плёнка, лента, снятие КТЯ
  robots: 7                   # [ОЦЕНКА] роботов-депаллетизаторов
  sec_per_pallet: 120         # [ОЦЕНКА] полный цикл на палету (20 КТЯ)

transport_in:                 # транспортировка КТЯ до участка сортировки
  sec: 90                     # [ОЦЕНКА] время хода по конвейеру
  line_capacity_boxes: 400    # [ОЦЕНКА] ёмкость линии (КТЯ одновременно)

box_opening:                  # вскрытие КТЯ, установка у зоны загрузки
  stations: 16                # [ОЦЕНКА] расчёт: 3704 КТЯ/ч ÷ 240/ч = 15.4
  sec_per_box: 15             # [ОЦЕНКА]

infeed:                       # перекладка товаров из КТЯ в сортировочную систему
  mode: auto                  # auto | manual  (ключевой рычаг автоматизации!)
  stations: 14                # [ОЦЕНКА] автоматических станций загрузки
  sec_per_item_auto: 0.45     # [ОЦЕНКА] такт авто-загрузки на товар
  sec_per_item_manual: 3.6    # [ТЗ] 1000 товаров/час на человека = 3.6 с/товар
  manual_operators: 100       # [ТЗ] при ручной загрузке: 10 чел × 10 сортеров

sorters:                      # автоматические сортировщики (3D-сортер из ТЗ)
  count: 11                   # 10 = впритык (0% резерва) → берём 11 [ОЦЕНКА]
  items_per_hour_each: 10000  # [ТЗ] производительность одного сортировщика
  min_items_per_hour: 1000    # [ТЗ] минимум при ручной загрузке
  assignment_mode: split      # split | strict
  # ВАЖНО (наша находка из аналитической модели): при Парето 80/20
  # топ-направление несёт ~18 600 тов/час > 10 000 (мощность сортера).
  # strict (направление жёстко к одному сортеру) => перегрузка и вечная
  # очередь; split => тяжёлые направления получают скаты на нескольких
  # сортерах (динамическое назначение скатов). Сценарий-сравнение — в отчёт.

chutes:                       # выходные скаты: наполнение КТЯ по направлениям
  fill_target_items: 27       # [ТЗ] целевая вместимость КТЯ
  fill_timeout_min: 45        # [ОЦЕНКА] таймаут закрытия неполного КТЯ
                              # (компромисс: плотность заполнения vs время цикла)

tare:                         # контур тары (КТЯ)
  reuse_share: 0.80           # [ТЗ] 80% КТЯ используются повторно
  scrap_share: 0.20           # [ТЗ] 20% уходят в брак, возмещаются новыми
  new_box_machine_per_hour: 900  # [ОЦЕНКА] производительность машины новых коробов

sealing:                      # заклейка КТЯ
  stations: 12                # [ОЦЕНКА] расчёт: 3704 КТЯ/ч ÷ 360/ч = 10.3
  sec_per_box: 10             # [ОЦЕНКА]

transport_out:
  sec: 60                     # [ОЦЕНКА] транспортировка до буфера отгрузки

palletizing:
  robots: 9                   # [ОЦЕНКА] расчёт: 185 палет/ч ÷ 22.5/ч = 8.2
  sec_per_box: 8              # [ОЦЕНКА] укладка одного КТЯ на палету

shipping:
  gates: 24                   # [ТЗ] ворот отгрузки
  pallets_ktya_per_truck: 16  # [ТЗ] палет с КТЯ на машину
  rollcages_per_truck: 16     # [ТЗ] остальные места — роллкейджи nonsort
  loading_hours: 2.0          # [ТЗ] время погрузки одной машины

manual_sort:                  # ручная обработка nonsort-потока
  workers: 22                 # [ОЦЕНКА] расчёт: 5000 тов/ч ÷ 250 = 20
  items_per_hour_each: 250    # [ТЗ] производительность ручной сортировки
  rollcage_capacity_items: 120  # [ОЦЕНКА] вместимость роллкейджа
